title    = "O spread copia só o primeiro nível"
category = "sintaxe"
editable = ["exercicio.mjs"]

objective = """
Implemente clonarConfig, que devolve uma cópia de config totalmente
independente do original — inclusive o objeto aninhado em config.tema não
pode ser compartilhado entre os dois.

O código já escrito devolve um objeto diferente do recebido, e os testes
simples de campo passam. Rode os testes inteiros: um deles mexe no aninhado
da cópia e espia o original.
"""

hints = [
  "{ ...config } cria um objeto novo, mas cada valor dentro dele é copiado por atribuição simples — para um objeto aninhado, isso copia a referência, não o conteúdo.",
  "Depois do spread, clone.tema e config.tema apontam para o MESMO objeto. Alterar clone.tema.cor altera config.tema.cor também.",
  "Para o aninhado ficar de fato independente, ele também precisa virar um objeto novo: { ...config, tema: { ...config.tema } }.",
]

[validation]
mode    = "test"
command = ["node", "--test", "exercicio.test.mjs"]
timeout = "30s"
